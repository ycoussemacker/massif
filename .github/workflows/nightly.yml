# Massif nightly — cloud replacement for nightly.sh/morning.sh (runs without the Mac).
#
# Pulls Strava + Garmin, rolls up the unified load model, runs the coach briefing, and the coach
# delivers the morning Web Push. Garmin has no official API + an MFA-gated first login, so its OAuth
# token is seeded ONCE from the Mac into Supabase (integration_tokens, provider='garmin') and the
# Python ingest rehydrates it here — see ops/PHONE_ACCESS.md.
#
# FRESHNESS GATE: instead of generating at a fixed time, the job fires several times across the
# morning and the gate (massif_ingest.morning) only PROCEEDS once Garmin has finalized last night's
# sleep — so the briefing reflects that morning's recovery. A final "force" slot generates anyway if
# the night never finalized. Once today's briefing exists, every later slot is a no-op (idempotent),
# so you get exactly one briefing + one push.
#
# Schedule is UTC. Summer (CEST, UTC+2): poll ≈06:30–08:30 Paris, force ≈09:00. Winter (CET, UTC+1):
# one hour earlier. Adjust the cron lines to your wake time.
name: massif-nightly

on:
  schedule:
    - cron: "30 4 * * *"   # ~06:30 Paris (summer) — poll
    - cron: "0 5 * * *"    # ~07:00 — poll
    - cron: "30 5 * * *"   # ~07:30 — poll
    - cron: "0 6 * * *"    # ~08:00 — poll
    - cron: "30 6 * * *"   # ~08:30 — poll
    - cron: "0 7 * * *"    # ~09:00 — FINAL: force-generate even if sleep never finalized
  workflow_dispatch: {} # manual "Run workflow" → forces a generation now

concurrency:
  group: massif-nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COACH_MODEL: ${{ secrets.COACH_MODEL || 'claude-sonnet-4-6' }}
      ATHLETE_TZ: ${{ secrets.ATHLETE_TZ || 'Europe/Paris' }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT || 'mailto:coach@massif.app' }}
      COACH_SKIP_IF_DONE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/pyproject.toml

      - name: Install ingest
        run: pip install -e ingest

      - name: Morning gate (generate only once sleep is finalized)
        id: gate
        run: |
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "0 7 * * *" ]; then
            FORCE="--force"
          fi
          set +e
          python -m massif_ingest.morning $FORCE
          code=$?
          set -e
          case "$code" in
            0)  echo "proceed=true"  >> "$GITHUB_OUTPUT" ;;
            10) echo "proceed=false" >> "$GITHUB_OUTPUT" ;;
            *)  echo "gate errored (exit $code)"; exit "$code" ;;
          esac

      - name: Set up pnpm
        if: steps.gate.outputs.proceed == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: coach/pnpm-lock.yaml

      - name: Install coach deps
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm -C coach install --no-frozen-lockfile

      - name: Pull + roll up (Strava + Garmin + model)
        if: steps.gate.outputs.proceed == 'true'
        run: python -m massif_ingest.sync

      - name: Coach briefing + morning push
        if: steps.gate.outputs.proceed == 'true'
        run: pnpm -C coach coach
