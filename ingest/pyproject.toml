[project]
name = "massif-ingest"
version = "0.1.0"
description = "Massif — multi-sport data ingestion (Strava + Garmin) and training-load computation"
requires-python = ">=3.11"
dependencies = [
  "garminconnect>=0.2.25",   # python-garminconnect: Garmin Connect login + recovery metrics
  "requests>=2.32",          # Strava REST API
  "supabase>=2.9",           # write rows to Supabase Postgres
  "python-dotenv>=1.0",      # load .env
  "pandas>=2.2",             # metric computation (decoupling, time-in-zone, EWMA load model)
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
massif-sync = "massif_ingest.sync:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
